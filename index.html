<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Dive — Feedback</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
      background: #f6f7f9;
    }
    .card {
      max-width: 480px; width: 100%;
      background: #fff; border-radius: 16px; padding: 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    p { color: #555; margin: 4px 0; font-size: 14px; }
    .detail { color: #888; font-size: 12px; margin-top: 16px; word-break: break-all; }
    #sink { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; }
      .card { background: #1c1c1e; }
      p { color: #bbb; }
      .detail { color: #777; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Logging your feedback…</h1>
    <p id="subtitle">One sec.</p>
    <p class="detail" id="detail"></p>
  </div>

  <!-- Hidden iframe: the form POSTs into this so the visible page never navigates. -->
  <iframe name="sink" id="sink"></iframe>

  <script>
    const WEBHOOK_URL = "https://webhooks.backend.rox.com/webhooks/w/workflow-webhook-318d6a1b";

    const params = new URLSearchParams(window.location.search);
    const payload = Object.fromEntries(params.entries());

    const ACTION_META = {
      pursue:          { icon: "🎯", label: "Pursue", copy: "Got it — drafting your outreach email. Check Home in a minute." },
      watch:           { icon: "👀", label: "Watch", copy: "Logged — we'll keep an eye on this signal." },
      wrong:           { icon: "❌", label: "Wrong", copy: "Thanks — Deep Dive will learn from this." },
      already_working: { icon: "✅", label: "Already Working", copy: "Got it — we'll skip this motion next time." }
    };

    const meta = ACTION_META[payload.action] || { icon: "📨", label: "Feedback", copy: "Logged." };

    // Build a real HTML form that POSTs the payload as a single `json` field.
    // Targeting the hidden iframe means the browser makes a "simple" POST
    // (no CORS preflight), so Rox actually receives the request.
    const form = document.createElement("form");
    form.method = "POST";
    form.action = WEBHOOK_URL;
    form.enctype = "application/x-www-form-urlencoded";
    form.target = "sink";
    form.style.display = "none";

    const field = document.createElement("input");
    field.type = "hidden";
    field.name = "json";
    field.value = JSON.stringify(payload);
    form.appendChild(field);

    document.body.appendChild(form);
    form.submit();

    // We can't read the response (cross-origin), so report success optimistically.
    // The webhook fires either way; the browser just can't see the ack.
    document.getElementById("icon").textContent = meta.icon;
    document.getElementById("title").textContent = meta.label + " logged";
    document.getElementById("subtitle").textContent = meta.copy;
    document.getElementById("detail").textContent = payload.account_name
      ? `${payload.account_name} · ${payload.motion_type || ""}`.trim()
      : "";
  </script>
</body>
</html>
