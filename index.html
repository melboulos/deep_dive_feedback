<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Dive — Feedback</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
      background: #f6f7f9;
    }
    .card {
      max-width: 480px; width: 100%;
      background: #fff; border-radius: 16px; padding: 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    p { color: #555; margin: 4px 0; font-size: 14px; }
    .detail { color: #888; font-size: 12px; margin-top: 16px; word-break: break-all; }
    .err { color: #b00020; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; }
      .card { background: #1c1c1e; }
      p { color: #bbb; }
      .detail { color: #777; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Logging your feedback…</h1>
    <p id="subtitle">One sec.</p>
    <p class="detail" id="detail"></p>
  </div>

  <!--
    Hidden iframe + form for cross-origin POST to the Rox webhook.
    Unlike fetch({mode:"no-cors"}), a real <form target="iframe"> POST
    is a plain cross-origin form submission — browsers have allowed
    these since forever, no preflight, no CORS blocking, no opaque-
    response weirdness. The iframe swallows the response so the user's
    page doesn't navigate away.
  -->
  <iframe name="rox_sink" style="display:none" aria-hidden="true"></iframe>
  <form id="feedbackForm"
        action="https://webhooks.backend.rox.com/webhooks/w/workflow-webhook-318d6a1b"
        method="POST"
        enctype="application/x-www-form-urlencoded"
        target="rox_sink"
        style="display:none">
    <input type="hidden" name="json" id="jsonField">
  </form>

  <script>
    const params = new URLSearchParams(window.location.search);
    const payload = Object.fromEntries(params.entries());

    const ACTION_META = {
      pursue:          { icon: "🎯", label: "Pursue", copy: "Got it — drafting your outreach email. Check Home in a minute." },
      watch:           { icon: "👀", label: "Watch", copy: "Logged — we'll keep an eye on this signal." },
      wrong:           { icon: "❌", label: "Wrong", copy: "Thanks — Deep Dive will learn from this." },
      already_working: { icon: "✅", label: "Already Working", copy: "Got it — we'll skip this motion next time." }
    };

    const meta = ACTION_META[payload.action] || { icon: "📨", label: "Feedback", copy: "Logged." };

    function render(state) {
      const icon = document.getElementById("icon");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const detail = document.getElementById("detail");
      if (state === "ok") {
        icon.textContent = meta.icon;
        title.textContent = meta.label + " logged";
        subtitle.textContent = meta.copy;
        detail.textContent = payload.account_name
          ? `${payload.account_name} · ${payload.motion_type || ""}`.trim()
          : "";
      } else if (state === "err") {
        icon.textContent = "⚠️";
        title.textContent = "Couldn't send feedback";
        subtitle.className = "err";
        subtitle.textContent = "Something went wrong. Close this tab and try the button again.";
        detail.textContent = "";
      }
    }

    // Serialize the full URL-params payload into the form's json field,
    // then submit. The Rox webhook wraps this under trigger_data.payload;
    // the Deep Dive Feedback agent reads trigger_data.payload.json and
    // JSON.parse's it to recover action, signal_id, account_id, etc.
    try {
      document.getElementById("jsonField").value = JSON.stringify(payload);
      document.getElementById("feedbackForm").submit();
      // Optimistic: the iframe absorbs the response, so we can't read status.
      // Rox webhooks are highly reliable once the POST leaves the browser.
      render("ok");
    } catch (e) {
      render("err");
    }
  </script>
</body>
</html>
