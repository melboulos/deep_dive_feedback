<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Dive — Feedback</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
      background: #f6f7f9;
    }
    .card {
      max-width: 480px; width: 100%;
      background: #fff; border-radius: 16px; padding: 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    p { color: #555; margin: 4px 0; font-size: 14px; }
    .detail { color: #888; font-size: 12px; margin-top: 16px; word-break: break-all; }
    .err { color: #b00020; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; }
      .card { background: #1c1c1e; }
      p { color: #bbb; }
      .detail { color: #777; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Logging your feedback…</h1>
    <p id="subtitle">One sec.</p>
    <p class="detail" id="detail"></p>
  </div>

  <script>
    const WEBHOOK_URL = "https://webhooks.backend.rox.com/webhooks/w/workflow-webhook-318d6a1b";

    const params = new URLSearchParams(window.location.search);
    const payload = Object.fromEntries(params.entries());

    const ACTION_META = {
      pursue:          { icon: "🎯", label: "Pursue", copy: "Got it — drafting your outreach email. Check Home in a minute." },
      watch:           { icon: "👀", label: "Watch", copy: "Logged — we'll keep an eye on this signal." },
      wrong:           { icon: "❌", label: "Wrong", copy: "Thanks — Deep Dive will learn from this." },
      already_working: { icon: "✅", label: "Already Working", copy: "Got it — we'll skip this motion next time." }
    };

    const meta = ACTION_META[payload.action] || { icon: "📨", label: "Feedback", copy: "Logged." };

    function render(state) {
      const icon = document.getElementById("icon");
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const detail = document.getElementById("detail");
      if (state === "ok") {
        icon.textContent = meta.icon;
        title.textContent = meta.label + " logged";
        subtitle.textContent = meta.copy;
        detail.textContent = payload.account_name
          ? `${payload.account_name} · ${payload.motion_type || ""}`.trim()
          : "";
      } else if (state === "err") {
        icon.textContent = "⚠️";
        title.textContent = "Couldn't send feedback";
        subtitle.className = "err";
        subtitle.textContent = "Something went wrong. Close this tab and try the button again.";
        detail.textContent = "";
      }
    }

    // Send the payload as JSON in a form field. The Deep Dive Feedback
    // webhook wraps this under trigger_data.payload; the agent reads
    // trigger_data.payload.json and JSON.parse's it to get the fields.
    // We use "no-cors" so the browser doesn't preflight — trade-off is
    // we can't read the response, so we optimistically report success.
    const body = new URLSearchParams();
    body.set("json", JSON.stringify(payload));

    fetch(WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: body.toString()
    })
    .then(() => render("ok"))
    .catch(() => render("err"));
  </script>
</body>
</html>
